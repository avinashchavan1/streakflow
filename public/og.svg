<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#ffb340"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="33%" stop-color="#ffb340"/>
      <stop offset="66%" stop-color="#00d9b2"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(255,45,85,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,45,85,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#100e0c"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(80,80)">
    <rect width="56" height="56" rx="14" fill="#100e0c" stroke="url(#ring)" stroke-width="3"/>
    <circle cx="28" cy="28" r="16" fill="none" stroke="url(#ring)" stroke-width="6"/>
    <text x="78" y="38" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="26" font-weight="700" fill="#f5efe7" letter-spacing="-0.5">StreakFlow</text>
  </g>

  <!-- Main headline -->
  <text x="80" y="310" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="84" font-weight="700" fill="#f5efe7" letter-spacing="-3">The free habit tracker</text>
  <text x="80" y="400" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">
    <tspan fill="#f5efe7">that </tspan>
    <tspan fill="url(#g)">actually sticks.</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="26" fill="#b8aea2">Streaks. XP. Badges. Weekly AI insights. Free forever.</text>

  <!-- Tags -->
  <g transform="translate(80,510)" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="20" font-weight="600">
    <g><rect width="170" height="44" rx="22" fill="#1a1714" stroke="rgba(255,240,220,0.14)"/><text x="32" y="29" fill="#f5efe7">🔥 Streaks</text></g>
    <g transform="translate(186,0)"><rect width="120" height="44" rx="22" fill="#1a1714" stroke="rgba(255,240,220,0.14)"/><text x="22" y="29" fill="#f5efe7">⚡ XP</text></g>
    <g transform="translate(322,0)"><rect width="160" height="44" rx="22" fill="#1a1714" stroke="rgba(255,240,220,0.14)"/><text x="22" y="29" fill="#f5efe7">🏆 Badges</text></g>
    <g transform="translate(498,0)"><rect width="210" height="44" rx="22" fill="#1a1714" stroke="rgba(255,240,220,0.14)"/><text x="22" y="29" fill="#f5efe7">✨ AI insights</text></g>
  </g>

  <!-- Ring artwork (right side) -->
  <g transform="translate(880,170)">
    <circle cx="160" cy="160" r="150" fill="none" stroke="#ff2d55" stroke-opacity="0.18" stroke-width="20"/>
    <circle cx="160" cy="160" r="150" fill="none" stroke="#ff2d55" stroke-width="20" stroke-linecap="round" stroke-dasharray="942 942" transform="rotate(-90 160 160)"/>
    <circle cx="160" cy="160" r="118" fill="none" stroke="#ffb340" stroke-opacity="0.18" stroke-width="20"/>
    <circle cx="160" cy="160" r="118" fill="none" stroke="#ffb340" stroke-width="20" stroke-linecap="round" stroke-dasharray="460 742" transform="rotate(-90 160 160)"/>
    <circle cx="160" cy="160" r="86" fill="none" stroke="#00d9b2" stroke-opacity="0.18" stroke-width="20"/>
    <circle cx="160" cy="160" r="86" fill="none" stroke="#00d9b2" stroke-width="20" stroke-linecap="round" stroke-dasharray="540 540" transform="rotate(-90 160 160)"/>
    <circle cx="160" cy="160" r="54" fill="none" stroke="#af52de" stroke-opacity="0.18" stroke-width="20"/>
    <circle cx="160" cy="160" r="54" fill="none" stroke="#af52de" stroke-width="20" stroke-linecap="round" stroke-dasharray="135 340" transform="rotate(-90 160 160)"/>
    <text x="160" y="172" font-family="system-ui, -apple-system, Inter, sans-serif" font-size="56" font-weight="700" fill="#f5efe7" text-anchor="middle">76%</text>
  </g>
</svg>
